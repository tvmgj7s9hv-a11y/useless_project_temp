name: Build ScrollMeter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK with Gradle
        run: |
          cd android
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Generated
        run: |
          ls -la android/app/build/outputs/apk/debug/
          cp android/app/build/outputs/apk/debug/app-debug.apk ./ScrollMeter-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrollMeter-debug-apk
          path: ./ScrollMeter-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.2-apk
          name: "SAHAL'S SCROLL v1.0.2 (Android APK)"
          draft: false
          prerelease: false
          files: ./ScrollMeter-debug.apk
          body: |
            ### 📱 SAHAL'S SCROLL Android APK Download
            
            Install directly on your Android phone to track Instagram scrolling in the background!
            
            #### 📥 Direct Download:
            Click on **ScrollMeter-debug.apk** in the Assets section below to download directly to your phone.
            
            #### 🚀 Installation Instructions:
            1. Once downloaded, open **ScrollMeter-debug.apk** on your Android phone.
            2. Tap **Install** (allow *"Install unknown apps"* if your browser asks).
            3. Open **SAHAL'S SCROLL**.
            4. Tap **"Enable in Accessibility Settings"**.
            5. Toggle **SAHAL'S SCROLL** ON under *Accessibility > Installed Services*.
            6. Open Instagram and start scrolling!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
